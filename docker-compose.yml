version: "3.9"
services:
  radhard:
    build: .
    volumes:
      - ./results:/work/results
      - ./data:/work/data
    environment:
      - PYTHONPATH=/work/src
      - TZ=UTC
    command: bash run_all.sh
  notebook:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - .:/work
    command: jupyter notebook --ip=0.0.0.0 --allow-root --no-browser --NotebookApp.token=''
